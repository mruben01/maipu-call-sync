name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  test-android:
    name: Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "11076708"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Run Android unit tests
        working-directory: android-app
        run: ./gradlew test

  release-android:
    name: Build signed Maipú release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test-android
    runs-on: ubuntu-latest
    environment: android-signing
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "11076708"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Restore protected signing keystore
        shell: bash
        env:
          MAIPU_SIGNING_KEYSTORE_B64: ${{ secrets.MAIPU_SIGNING_KEYSTORE_B64 }}
          MAIPU_SIGNING_PASSWORD: ${{ secrets.MAIPU_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MAIPU_SIGNING_KEYSTORE_B64:-}" || -z "${MAIPU_SIGNING_PASSWORD:-}" ]]; then
            echo "::error::Faltan los secretos de firma en el Environment android-signing."
            exit 1
          fi
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error::Falta la configuración pública de Supabase para la APK."
            exit 1
          fi
          umask 077
          signing_file="$RUNNER_TEMP/maipu-release-signing.p12"
          printf '%s' "$MAIPU_SIGNING_KEYSTORE_B64" | base64 --decode > "$signing_file"
          test -s "$signing_file"
          echo "MAIPU_SIGNING_KEYSTORE_FILE=$signing_file" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android-app
        env:
          MAIPU_SIGNING_PASSWORD: ${{ secrets.MAIPU_SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify release identity and signature
        shell: bash
        env:
          MAIPU_SIGNING_CERT_SHA256: ${{ vars.MAIPU_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="android-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          package_line="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1p')"
          if [[ "$package_line" != *"name='com.maipu.callsync'"* ||
                "$package_line" != *"versionCode='2'"* ||
                "$package_line" != *"versionName='3.0.0'"* ]]; then
            echo "::error::El package o la versión release no coincide con lo aprobado."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apksigner-report.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner-report.txt" | tr '[:upper:]' '[:lower:]' | sed -n '1p')"
          expected="$(printf '%s' "$MAIPU_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            echo "::error::El certificado de firma no coincide con la huella pública aprobada."
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/maipu-call-sync.apk"
          echo "Identidad, versión y certificado release verificados."

      - name: Upload official signed APK
        uses: actions/upload-artifact@v4
        with:
          name: maipu-call-sync-release
          path: ${{ runner.temp }}/maipu-call-sync.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/maipu-release-signing.p12"
